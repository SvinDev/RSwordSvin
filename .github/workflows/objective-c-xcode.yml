name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyze relazin
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          set -uo pipefail
          xcodebuild \
            -project relazin.xcodeproj \
            -scheme relazin \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64e \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build analyze 2>&1 | tee xcodebuild.log
          build_status=${PIPESTATUS[0]}

          if [ "$build_status" -ne 0 ]; then
            grep -E '(^| )(error:|fatal error:|duplicate symbol|Undefined symbols|ld:|clang:)' xcodebuild.log \
              | tail -n 100 \
              | while IFS= read -r line; do
                  line="${line//'%'/'%25'}"
                  line="${line//$'\r'/'%0D'}"
                  echo "::error::$line"
                done
            exit "$build_status"
          fi
