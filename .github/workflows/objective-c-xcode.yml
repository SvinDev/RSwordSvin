name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyze relazin
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          set -uo pipefail
          xcodebuild \
            -project relazin.xcodeproj \
            -scheme relazin \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64e \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build analyze 2>&1 | tee xcodebuild.log
          build_status=${PIPESTATUS[0]}

          if [ "$build_status" -ne 0 ]; then
            failure_tail=$(tail -n 80 xcodebuild.log)
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            echo "::error title=xcodebuild failed::$failure_tail"
            exit "$build_status"
          fi
